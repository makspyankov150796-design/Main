name: Delphi Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show workspace
        shell: cmd
        run: |
          cd
          echo GITHUB_WORKSPACE=%GITHUB_WORKSPACE%
          dir
          dir *.dproj /s

      - name: Build Delphi project
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Embarcadero\Studio\23.0\bin\rsvars.bat"
          msbuild "%GITHUB_WORKSPACE%\ProjectFornTest.dproj" /t:Build /p:Config=Debug /p:Platform=Win32
